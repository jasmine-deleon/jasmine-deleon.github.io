.bar .who{white-space:nowrap;color:var(--bar-mut)}

.bar button{font:inherit;cursor:pointer;color:var(--bar-mut);background:none;border:1px solid var(--bar-line);border-radius:999px;padding:7px 12px;white-space:nowrap;flex:none}
.bar button:hover{color:var(--bar-fg);border-color:var(--bar-mut)}
.bar button:focus-visible{outline:2px solid var(--bar-acc);outline-offset:2px}
.bar .chip[aria-pressed="true"]{background:var(--bar-acc);border-color:var(--bar-acc);color:var(--bar-ink);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding-block:2px}
.chips::-webkit-scrollbar{display:none}
@media (max-width:640px){.bar .who{display:none}}

.dz{min-height:100vh;position:relative}
.dz *,.dz *::before,.dz *::after{box-sizing:border-box}

.dz [id^="s-"]{scroll-margin-top:70px}
.dz .wd{display:inline-block;white-space:nowrap}
.dz .ch{display:inline-block}
.dz :focus-visible{outline:2px solid currentColor;outline-offset:3px}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i,0)*70ms)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.dz *,.dz *::before,.dz *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important;transition-delay:0s!important}}

  }

  const h=(location.hash||'').slice(1),k=D.findIndex(d=>d.id===h);
